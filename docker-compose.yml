networks:
  default:
    name: ridehub-network
  ridehub-network:
    name: ridehub-network
    driver: bridge

services:
  infra-init:
    image: alpine:latest
    container_name: infra-init
    restart: "no"
    user: "0"
    environment:
      DOMAIN: ${DOMAIN:-phungvip.io.vn}
      APP_F4_PASS: ${APP_F4_PASS:-}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./central-server-config:/config:rw
    command:
      - /bin/sh
      - -c
      - |
        echo ">> [infra-init] Tự động chuẩn bị cấu hình hạ tầng..."
        # 1. Tự động sinh cloudflared/config.yml từ template nếu chưa có hoặc cập nhật domain
        if [ -f /config/cloudflared/config.yml.template ]; then
          sed -e "s|\$${DOMAIN}|$${DOMAIN:-phungvip.io.vn}|g" \
              /config/cloudflared/config.yml.template > /config/cloudflared/config.yml
          echo ">> [infra-init] ✓ Đã sinh cloudflared/config.yml"
        fi
        # 2. Tự động khởi tạo ops-control.json nếu chưa có
        DASH_DIR="/config/observability/grafana/provisioning/dashboards/admin"
        if [ -f "$$DASH_DIR/ops-control.json.example" ] && [ ! -f "$$DASH_DIR/ops-control.json" ]; then
          cp "$$DASH_DIR/ops-control.json.example" "$$DASH_DIR/ops-control.json"
          echo ">> [infra-init] ✓ Đã tạo ops-control.json"
        fi
        # 3. Đảm bảo các thư mục và file token cần thiết tồn tại
        mkdir -p /config/kafka/tls
        touch /config/consul/consul-tokens.env
        touch /config/vault/vault-tokens.env
        echo ">> [infra-init] ✓ Hoàn tất chuẩn bị cấu hình!"

  kafka:
    image: quay.io/strimzi/kafka:0.48.0-kafka-4.1.0
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    user: root
    command:
      - /bin/bash
      - -c
      - |
        # Set log directory to writable location
        export LOG_DIR=/tmp/kafka-logs
        mkdir -p $$LOG_DIR
        # Tự động render kraft-config.properties từ template nếu có
        if [ -f /tmp/kraft-config.properties.template ]; then
          echo ">> [kafka-init] Tự động render kraft-config.properties từ template theo DOMAIN=$${DOMAIN:-phungvip.io.vn}..."
          sed -e "s|\$${DOMAIN}|$${DOMAIN:-phungvip.io.vn}|g" \
              -e "s|\$${S2S_CLIENT_ID}|$${S2S_CLIENT_ID}|g" \
              -e "s|\$${S2S_CLIENT_SECRET}|$${S2S_CLIENT_SECRET}|g" \
              /tmp/kraft-config.properties.template > /tmp/kraft-config.properties
        fi
        # Tự động sinh SSL Keystore & Truststore nếu chưa tồn tại
        OUTPUT_DIR=/etc/kafka/secrets /bin/bash /opt/kafka/scripts/kafka-init.sh --ssl
        # Format KRaft storage (only if not already formatted)
        export CLUSTER_ID=$${CLUSTER_ID:-kafka-cluster-01}
        if [ ! -f /var/lib/kafka/data/meta.properties ]; then
          bin/kafka-storage.sh format -t $$CLUSTER_ID -c /tmp/kraft-config.properties
        fi
        # Start Kafka and initialize ACLs
        bin/kafka-server-start.sh /tmp/kraft-config.properties &
        KAFKA_PID=$$!
        if [ -f /opt/kafka/scripts/kafka-init.sh ]; then
          /bin/bash /opt/kafka/scripts/kafka-init.sh --acls &
        fi
        wait $$KAFKA_PID
    ports:
      - "127.0.0.1:9094:9092" # External SSL - localhost only
      - "172.17.0.1:9094:9092" # External SSL - docker0 gateway for microservices
      - "127.0.0.1:9093:9093" # OAuth SASL_SSL - localhost only
      - "172.17.0.1:9093:9093" # OAuth SASL_SSL - docker0 gateway for microservices

    environment:
      # Cluster ID for KRaft
      CLUSTER_ID: kafka-cluster-01
      # Disable GC logging to avoid permission issues
      KAFKA_GC_LOG_OPTS: " "
      # Kafka logging for OAuth
      KAFKA_LOG4J_LOGGERS: "io.strimzi.kafka.oauth=DEBUG,org.apache.kafka.common.security.oauthbearer=DEBUG"
      # SSL passwords
      APP_F4_PASS: ${APP_F4_PASS}
      S2S_CLIENT_ID: ${S2S_CLIENT_ID}
      S2S_CLIENT_SECRET: ${S2S_CLIENT_SECRET}
      DOMAIN: ${DOMAIN:-phungvip.io.vn}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # Vault integration
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      SPRING_CLOUD_VAULT_URI: http://vault:8200
      SPRING_CLOUD_VAULT_TOKEN: root
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Mount KRaft configuration template & scripts
      - ./central-server-config/kafka/kraft-config.properties.template:/tmp/kraft-config.properties.template:ro
      - ./central-server-config/kafka/kafka-init.sh:/opt/kafka/scripts/kafka-init.sh:ro
      # SSL certificates directory
      - ./central-server-config/kafka/tls:/etc/kafka/secrets:rw
      # CA certificates for remote Keycloak
      - /etc/ssl/certs:/etc/ssl/certs:ro
      # Persistent data
      - kafka-oauth-data:/var/lib/kafka/data
    depends_on:
      infra-init:
        condition: service_completed_successfully
      vault:
        condition: service_started
      keycloak:
        condition: service_healthy
      nginx:
        condition: service_started
    labels:
      autoheal: "true"
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9093 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    # ports:
    #   - "8080:8080"
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:19092
      - JVM_OPTS=-Xms256M -Xmx512M -Duser.timezone=Asia/Ho_Chi_Minh
      - APP_F4_PASS=${APP_F4_PASS}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./central-server-config/kafka/tls:/etc/kafka/secrets:ro
    depends_on:
      keycloak:
        condition: service_healthy
    labels:
      autoheal: "true"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP'" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  consul:
    image: hashicorp/consul:1.21.0
    container_name: consul
    restart: unless-stopped
    depends_on:
      infra-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8500"
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      CONSUL_MASTER_TOKEN: ${CONSUL_MASTER_TOKEN:-${APP_F4_PASS}}
    command: >
      consul agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
      -config-file=/consul/config/consul.hcl
      -hcl='acl { tokens { initial_management = "${CONSUL_MASTER_TOKEN:-${APP_F4_PASS}}" agent = "${CONSUL_MASTER_TOKEN:-${APP_F4_PASS}}" } }'
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./central-server-config/consul/consul.hcl:/consul/config/consul.hcl
      - ./central-server-config/consul/KV:/consul/KV
      - ./central-server-config/consul/sync-kv-to-files.sh:/consul/scripts/sync-kv-to-files.sh:ro
    labels:
      autoheal: "true"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8500/v1/status/leader | grep -q :8300" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  consul-config-loader:
    image: jhipster/consul-config-loader:v0.4.1
    container_name: consul-config-loader
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./central-server-config/consul/KV:/config
      - ./central-server-config/consul/consul-loader.sh:/upload-consul-file.sh:ro
      - ./central-server-config/consul/consul-loader.sh:/consul-loader.sh:ro
      - ./central-server-config/consul:/consul-config:rw
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - INIT_SLEEP_SECONDS=5
      - CONSUL_URL=consul
      - CONSUL_PORT=8500
      - CONSUL_MASTER_TOKEN=${CONSUL_MASTER_TOKEN:-${APP_F4_PASS}}
      - APP_F4_PASS=${APP_F4_PASS}
    command:
      - /bin/bash
      - -c
      - |
        export CONSUL_HTTP_ADDR="http://$$CONSUL_URL:$$CONSUL_PORT"
        export CONSUL_MASTER_TOKEN="$${CONSUL_MASTER_TOKEN:-$${APP_F4_PASS}}"
        export OUTPUT_TOKEN_FILE="/consul-config/consul-tokens.env"
        export POLICIES_DIR="/consul-config/policies"
        if [ -f /consul-loader.sh ]; then
          echo ">> [consul-config-loader] Tự động khởi tạo Consul ACL Policies & Tokens..."
          /bin/bash /consul-loader.sh --init || true
        fi
        if [ -f "$$OUTPUT_TOKEN_FILE" ]; then
          set -a; source "$$OUTPUT_TOKEN_FILE" 2>/dev/null || true; set +a
        fi
        export CONSUL_HTTP_TOKEN="$${CONSUL_TOKEN_CONFIG_DEPLOYER:-$$CONSUL_MASTER_TOKEN}"
        exec /load-config.sh
    depends_on:
      consul:
        condition: service_healthy
    labels:
      autoheal: "true"

  redis:
    image: redis:7.4.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
      - "172.17.0.1:6379:6379"  # docker0 gateway for host.docker.internal without exposing to public WAN
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    command: redis-server --requirepass ${APP_F4_PASS}
    labels:
      autoheal: "true"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$APP_F4_PASS\" ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - RI_ACCEPT_TERMS_AND_CONDITIONS=true
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_ALIAS=RideHub-Redis
      - RI_REDIS_USERNAME=default
      - RI_REDIS_PASSWORD=${APP_F4_PASS}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      redis:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.1
    restart: unless-stopped
    entrypoint: ["/opt/keycloak/keycloak-entrypoint.sh"]
    command:
      - "start-dev"
      - "--import-realm"
      - "--proxy-headers=xforwarded"
      - "--hostname=https://keycloak.${DOMAIN}"
      - "--hostname-admin=https://keycloak.${DOMAIN}"
      - "--hostname-strict=true"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./central-server-config/keycloak/jhipster-realm.json.template:/opt/keycloak/templates/jhipster-realm.json.template:ro
      - ./central-server-config/keycloak/keycloak-entrypoint.sh:/opt/keycloak/keycloak-entrypoint.sh:ro
      - ./central-server-config/keycloak/keycloak-health-check.sh:/opt/keycloak/health-check.sh
      # - ./central-server-config/keycloak/keycloak-custom-reg/lib:/opt/keycloak/providers
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - KC_DB=dev-file
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - DOMAIN=${DOMAIN}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - S2S_CLIENT_SECRET=${S2S_CLIENT_SECRET}
      - CF_TEAM_NAME=${CF_TEAM_NAME:-appf4}
      - KC_FEATURES=scripts
      - KC_HTTP_PORT=9080
      - KC_HTTPS_PORT=9443
      - KC_HEALTH_ENABLED=true
      - KC_HTTP_MANAGEMENT_PORT=9990
      - KC_HOSTNAME_PORT=443
      - KC_FRONTEND_URL=https://keycloak.${DOMAIN}
      - KC_HOSTNAME_STRICT_HTTPS=true
      - KC_HTTP_ENABLED=true
    healthcheck:
      test: 'bash /opt/keycloak/health-check.sh'
      interval: 5s
      timeout: 5s
      retries: 50
      start_period: 10s
    labels:
      autoheal: "true"

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:80:80" # localhost only; public traffic routes via cloudflared tunnel
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - DOMAIN=${DOMAIN}
      - NGINX_ENVSUBST_FILTER=DOMAIN
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./central-server-config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./central-server-config/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    command: tunnel --metrics 0.0.0.0:2000 --config /etc/cloudflared/config.yml --no-autoupdate run
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./central-server-config/cloudflared:/etc/cloudflared:ro
    depends_on:
      infra-init:
        condition: service_completed_successfully
      nginx:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      autoheal: "true"

  vault:
    image: hashicorp/vault:latest
    container_name: vault
    restart: unless-stopped
    # ports:
    #   - "8200:8200"
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      VAULT_ADDR: http://0.0.0.0:8200
      APP_F4_PASS: ${APP_F4_PASS}
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-${APP_F4_PASS}}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - vault_data:/vault/data
      - ./central-server-config:/central-server-config:ro
      - ./central-server-config/vault/vault-tokens.env:/vault-tokens.env:rw
      - ./.env:/vault-secrets.env:ro
      - ./central-server-config/vault/vault-startup.sh:/vault-startup.sh:ro
    command: [ "/bin/sh", "/vault-startup.sh" ]
    depends_on:
      infra-init:
        condition: service_completed_successfully
  loki:
    image: grafana/loki:3.1.1
    container_name: loki
    restart: unless-stopped
    user: "0"
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./central-server-config/observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    expose:
      - "3100"
    labels:
      autoheal: "true"


  promtail:
    image: grafana/promtail:3.1.1
    container_name: promtail
    restart: unless-stopped
    user: "0" # chạy bằng root để đọc được docker.sock
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./central-server-config/observability/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
    depends_on:
      - loki
    labels:
      autoheal: "true"

  prometheus:
    image: prom/prometheus:v3.3.1
    container_name: prometheus
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-remote-write-receiver"
      - "--web.enable-lifecycle"
    expose:
      - "9090"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./central-server-config/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    labels:
      autoheal: "true"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    command:
      - --disable_metrics=disk,diskIO
      - --docker_only=true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /dev/disk/:/dev/disk:ro
    labels:
      autoheal: "true"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - GF_DATE_FORMATS_DEFAULT_TIMEZONE=Asia/Ho_Chi_Minh
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${APP_F4_PASS}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/developer/overview-containers.json
      - GF_EXPLORE_ENABLED=false
      - GF_ALERTING_ENABLED=false
      - GF_UNIFIED_ALERTING_ENABLED=false
      - GF_HELP_ENABLED=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_PLUGINS_PLUGIN_ADMIN_ENABLED=false
      # Database Connection Pooling & Performance
      - GF_DATABASE_MAX_OPEN_CONN=50
      - GF_DATABASE_MAX_IDLE_CONN=10
      - GF_DATABASE_CONN_MAX_LIFETIME=14400
      # Keycloak Generic OAuth Configuration (Zero Trust OIDC)
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Keycloak
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OIDC_CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email roles offline_access
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://keycloak.${DOMAIN}/realms/jhipster/protocol/openid-connect/auth
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://keycloak.${DOMAIN}/realms/jhipster/protocol/openid-connect/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://keycloak.${DOMAIN}/realms/jhipster/protocol/openid-connect/userinfo
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN=true
      - GF_AUTH_TOKEN_ROTATION_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP=true
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=preferred_username
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(roles[*], 'ROLE_ADMIN') && 'Admin' || contains(resource_access.grafana.roles[*], 'grafana-admin') && 'Admin' || contains(realm_access.roles[*], 'ROLE_ADMIN') && 'Admin' || contains(roles[*], 'ROLE_DEV') && 'Editor' || contains(realm_access.roles[*], 'ROLE_DEV') && 'Editor' || contains(roles[*], 'ROLE_MANAGER') && 'Editor' || contains(resource_access.grafana.roles[*], 'grafana-viewer') && 'Viewer' || contains(roles[*], 'grafana-viewer') && 'Viewer' || 'Viewer'
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT=false
      - GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN=false
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN=false
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_AUTH_SIGNOUT_REDIRECT_URL=https://keycloak.${DOMAIN}/realms/jhipster/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https%3A%2F%2Fgrafana.${DOMAIN}%2Flogin
      - GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL=https://keycloak.${DOMAIN}/realms/jhipster/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https%3A%2F%2Fgrafana.${DOMAIN}%2Flogin

    ports:
      - "127.0.0.1:3000:3000"
    expose:
      - "3000"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - grafana_data:/var/lib/grafana
      - ./central-server-config/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      infra-init:
        condition: service_completed_successfully
      loki:
        condition: service_started
      prometheus:
        condition: service_started
    labels:
      autoheal: "true"

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - AUTOHEAL_INTERVAL=5
      - AUTOHEAL_START_PERIOD=0
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
      # Only heal containers with label autoheal=true (default behavior)
      # - AUTOHEAL_CONTAINER_LABEL=autoheal
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m -Duser.timezone=Asia/Ho_Chi_Minh
      - discovery.type=single-node
      - xpack.security.enabled=false
    expose:
      - "9200"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - elasticsearch_data:/usr/share/elasticsearch/data
    labels:
      autoheal: "true"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=10s || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  socks5:
    image: serjs/go-socks5-proxy:latest
    container_name: socks5-proxy
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - PROXY_USER=dev
      - PROXY_PASSWORD=${APP_F4_PASS}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:1080:1080"
    labels:
      autoheal: "true"

  reposilite:
    image: dzikoysk/reposilite:3.5.19
    container_name: reposilite
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - REPOSILITE_OPTS=--token admin:${APP_F4_PASS}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - reposilite_data:/app/data
    labels:
      autoheal: "true"

volumes:
  vault_data:
  kafka-oauth-data:
    driver: local
  grafana_data:
  redisinsight_data:
  elasticsearch_data:
    driver: local
  reposilite_data:
  loki_data:
  prometheus_data:

